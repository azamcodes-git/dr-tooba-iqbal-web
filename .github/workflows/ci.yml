name: CI — Quality, Security, Gitleaks, Audit, Unit Tests & Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify:
    name: Lint, Typecheck, Audit, Unit/API Tests & Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [gitleaks]

    env:
      NODE_ENV: test
      NEXT_PUBLIC_SITE_URL: "https://drtoobaiqbal.com"
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: "1x00000000000000000000AA"
      NEXT_PUBLIC_WHATSAPP_NUMBER: "923101777649"
      TURNSTILE_SECRET_KEY: "1x0000000000000000000000000000000AA"
      ENABLE_DB_STORAGE: "false"
      PII_ENCRYPTION_KEY: "000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f"
      PII_BLIND_INDEX_KEY: "f1e1d1c1b1a191817161514131211101f0e0d0c0b0a090807060504030201000"
      NOTIFY_EMAIL_TO: "clinic@drtoobaiqbal.com"
      NOTIFY_EMAIL_FROM: "Dr. Tooba Iqbal Clinic <bookings@drtoobaiqbal.com>"
      CRON_SECRET: "ci-test-only-cron-secret-token-minimum-32-chars"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js (from .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Run npm security audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high || true

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript strict typecheck
        run: npm run typecheck

      - name: Run Vitest unit & API security tests
        run: npm test

      - name: Build production Next.js bundle
        env:
          NODE_ENV: production
        run: npm run build
