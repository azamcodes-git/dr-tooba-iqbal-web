name: 90-Day PII Retention Auto-Cleanup

on:
  schedule:
    # Runs daily at 02:15 UTC (07:15 AM PKT)
    - cron: "15 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  purge-expired-pii:
    name: Invoke /api/cron/retention
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger 90-Day PII Purge Endpoint
        env:
          SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Skipping remote retention call: NEXT_PUBLIC_SITE_URL or CRON_SECRET repository secret is not configured."
            exit 0
          fi

          RESPONSE_CODE=$(curl --silent --show-error --output /dev/null --write-out "%{http_code}" \
            --request POST "${SITE_URL}/api/cron/retention" \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            --header "Content-Type: application/json")

          echo "Retention endpoint HTTP status: ${RESPONSE_CODE}"
          if [ "$RESPONSE_CODE" -ne 200 ]; then
            echo "Retention cleanup returned non-200 status code: ${RESPONSE_CODE}"
            exit 1
          fi
